name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # F0-07 — Control bloqueante de vulnerabilidades. CI nunca auditaba las
      # dependencias, y por eso 4 CVE altas en Next.js (bypass de proxy, SSRF en
      # Server Actions) pasaron inadvertidas hasta la auditoría del 2026-07-24,
      # pese a existir un documento de readiness que afirmaba lo contrario.
      #
      # Umbral: high. Bloquea alta y crítica; las moderadas y bajas se reportan
      # en el paso informativo siguiente sin romper la build.
      - name: Security audit (blocking on high/critical)
        run: pnpm audit --prod --audit-level high

      - name: Security audit (informational, all severities)
        if: always()
        continue-on-error: true
        run: pnpm audit --prod

      # Incluye tests/db-guard.test.ts (F0-05): demuestra que los seeds y las
      # pruebas de integración rechazan cualquier destino que no sea loopback.
      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

name: CI

on:
  push:
    branches: [main, integration/commercial-v1]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # FIS-01a (HPO-G-04, docs/ops/release/CI_EXACT_SHA_BINDING_v1.0.0.json):
      # the closed event-SHA resolver. Runs BEFORE checkout — nothing is on
      # disk yet, so this cannot be a tsx script; scripts/ci-exact-sha-evidence.ts
      # exports the same semantics (resolveExpectedSha) for
      # tests/ci-exact-sha-binding.test.ts to exercise directly. No OR-style
      # fallback between two different events' SHA sources appears anywhere
      # here: every event branches explicitly and every non-matching case
      # fails the step.
      - name: Resolve exact event SHA
        id: resolve_sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_OR_DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              if [ -z "${PR_HEAD_SHA:-}" ]; then
                echo "::error::pull_request event missing github.event.pull_request.head.sha"
                exit 1
              fi
              EXPECTED_SHA="$PR_HEAD_SHA"
              EXPECTED_SOURCE="pull_request.head.sha"
              ;;
            push)
              if [ "$REF" != "refs/heads/main" ] && [ "$REF" != "refs/heads/integration/commercial-v1" ]; then
                echo "::error::push event on unapproved ref $REF"
                exit 1
              fi
              EXPECTED_SHA="$PUSH_OR_DISPATCH_SHA"
              EXPECTED_SOURCE="github.sha (push:$REF)"
              ;;
            workflow_dispatch)
              EXPECTED_SHA="$PUSH_OR_DISPATCH_SHA"
              EXPECTED_SOURCE="github.sha (workflow_dispatch)"
              ;;
            *)
              echo "::error::unsupported event $EVENT_NAME — no resolver branch authorizes it"
              exit 1
              ;;
          esac
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "source=$EXPECTED_SOURCE" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 (full history) rather than actions/checkout@v4's
      # default shallow clone. authority:seal:verify resolves historical
      # blobs at the ODS-01 freeze commit and the certified Wave 1 commit
      # (see scripts/authority-seal-verify.ts, ODS_AUTHORITY_FROZEN_COMMIT
      # and authority_corpus.anchor_commit) — a depth-1 checkout cannot
      # reach either, so the gate would fail closed for an infrastructure
      # reason indistinguishable in the log from real authority drift.
      #
      # ref: the exact resolved SHA above — never the default trigger ref,
      # which for pull_request is a synthetic, unmerged merge-ref commit
      # that is not the SHA that will land (FIS-01a PR merge-ref defense).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}
          fetch-depth: 0

      - name: Verify checkout resolved exact SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve_sha.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::checkout HEAD $ACTUAL_SHA does not match resolved EXPECTED_SHA $EXPECTED_SHA"
            exit 1
          fi

      # FIS-01a PR merge-ref defense: proves the synthetic merge-ref SHA
      # GitHub would checkout by default (absent an explicit `ref:`) is NOT
      # the SHA actually tested. Only meaningful for pull_request events.
      - name: Guard against testing the PR synthetic merge ref
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ steps.resolve_sha.outputs.sha }}
          MERGE_REF_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "${MERGE_REF_SHA:-}" ] && [ "$MERGE_REF_SHA" == "$EXPECTED_SHA" ]; then
            echo "::error::resolved HEAD $EXPECTED_SHA equals the synthetic PR merge-ref SHA $MERGE_REF_SHA"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First, and before anything that could echo a file into the log. The
      # 2026-07-06 leak sat in the tree for six weeks because no step was
      # looking; this is that step. It prints fingerprints, never values —
      # see scripts/scan-secrets.ts and docs/ops/CREDENTIAL_HYGIENE.md.
      #
      # It reads the working tree, so it catches a credential regardless of
      # which commit introduced it. It does NOT read history: the pre-rotation
      # blobs are a known, accepted and documented condition, not a regression.
      - name: Scan for credentials
        run: pnpm secrets:scan

      # Fails fast, before the expensive test/build stages, if the frozen
      # FIB/PC-01B/IM-01B authority corpus or the ODS v1 authority artifact
      # that reads it has drifted. See scripts/authority-seal-verify.ts and
      # docs/ops/ods/ODS_V1_AUTHORITY_v1.0.0.json (HPO-ODS-03). This was
      # previously established by hand every certification round; this step
      # is the deterministic replacement, not an addition alongside it.
      - name: Verify ODS authority
        run: pnpm authority:seal:verify

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Every generated artefact regenerated and compared byte for byte. The unit
      # suite already asserts most of this, but a check whose NAME says it is the
      # enforcement mechanism should be the thing that runs — a reviewer looking
      # for "where is this enforced" should not have to find it inside a test.
      - name: Verify generated artefacts
        run: |
          pnpm baseline:verify
          pnpm hosted:verify
          pnpm storage:verify
          pnpm journal:verify
          pnpm boundary:status:verify
          pnpm apply:status:verify
          pnpm probe:status:verify

      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # FIS-01a evidence emission — the final meaningful step. Runs only
      # after every required step above has exited 0 (no `if: always()`, no
      # `continue-on-error`). Binds EVIDENCE_SHA (git rev-parse HEAD,
      # cross-checked against the resolver), TREE (derived from
      # EVIDENCE_SHA, never a free-floating HEAD^{tree}), and the PR
      # merge-ref-not-tested defense into exact-sha-evidence.json. See
      # scripts/ci-exact-sha-evidence.ts.
      - name: Emit exact-SHA CI evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ steps.resolve_sha.outputs.sha }}
          EXPECTED_SOURCE: ${{ steps.resolve_sha.outputs.source }}
          MERGE_REF_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: pnpm exec tsx scripts/ci-exact-sha-evidence.ts

      - name: Upload exact-SHA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-evidence-${{ steps.resolve_sha.outputs.sha }}
          path: exact-sha-evidence.json

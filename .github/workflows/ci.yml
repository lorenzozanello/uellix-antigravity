name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Every generated artefact regenerated and compared byte for byte. The unit
      # suite already asserts most of this, but a check whose NAME says it is the
      # enforcement mechanism should be the thing that runs — a reviewer looking
      # for "where is this enforced" should not have to find it inside a test.
      - name: Verify generated artefacts
        run: |
          pnpm baseline:verify
          pnpm hosted:verify
          pnpm storage:verify
          pnpm journal:verify
          pnpm boundary:status:verify
          pnpm apply:status:verify
          pnpm probe:status:verify

      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

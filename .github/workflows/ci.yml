name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First, and before anything that could echo a file into the log. The
      # 2026-07-06 leak sat in the tree for six weeks because no step was
      # looking; this is that step. It prints fingerprints, never values —
      # see scripts/scan-secrets.ts and docs/ops/CREDENTIAL_HYGIENE.md.
      #
      # It reads the working tree, so it catches a credential regardless of
      # which commit introduced it. It does NOT read history: the pre-rotation
      # blobs are a known, accepted and documented condition, not a regression.
      - name: Scan for credentials
        run: pnpm secrets:scan

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:unit

      - name: Build
        run: pnpm build

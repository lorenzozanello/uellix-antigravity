name: P1A Bootstrap Gate

# The canonical LOCAL/CI clean-bootstrap-from-zero proof
# (docs/ops/p1a/P1A_FULL_BOOTSTRAP_AUTHORITY_v1.0.0.json, HPO-ODS-W2-11).
#
# Deliberately separate from the legacy .github/workflows/p1a-validation.yml,
# which remains untouched and out of scope for this authority — it cannot
# pass today for reasons unrelated to this gate (DATABASE_URL export a local
# entry point ignores by construction, and no step that creates
# .env.migration.local before pnpm db:migrate:local runs). This workflow
# proves the CANONICAL topology instead: a fresh disposable container this
# gate creates and destroys itself, no preexisting env dependency, the
# governed local role-identity package, the unmodified db:migrate:local,
# migration corpus 0000..0061, B0 postconditions, a genuine second-run cycle,
# ten real negative controls, and exact env restoration including the real
# SIGTERM signal path (P1A-N5). Never staging, never Production, never a
# persistent local-dev database.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/commercial-v1
      - main

jobs:
  p1a-bootstrap-gate:
    name: Canonical LOCAL/CI clean bootstrap proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full canonical gate: platform readiness, pristine-state
      # precondition, the governed local role-identity package (SHA-verified),
      # Part-A (reused verbatim from scripts/m2-disposable-pg-bootstrap.ts),
      # the temporary database-CREATE window, credential rotation from no
      # preexisting env, the unmodified db:migrate:local, mechanical
      # migration-corpus proof, ownership/privilege postconditions, B0 (via
      # the same shared vitest test scripts/m2-disposable-pg-bootstrap.ts
      # uses), a genuine second full cycle in a second fresh container, and
      # ten real negative controls. See scripts/p1a-bootstrap-gate.ts.
      - name: Run P1A canonical bootstrap gate
        run: pnpm p1a:bootstrap:gate

      # P1A-N4 (both vectors) and P1A-M3 run unconditionally as part of any
      # `pnpm test`/`pnpm test:unit`, so they are not repeated here. P1A-N5
      # (the real-SIGTERM env-restoration proof) is gated behind
      # P1A_GATE_REAL_DOCKER_TESTS=1 specifically so it never runs inside an
      # ordinary unit-test pass — this is the one place that variable is set.
      - name: Run P1A real-Docker test suite (P1A-N5 real SIGTERM)
        env:
          P1A_GATE_REAL_DOCKER_TESTS: '1'
        run: pnpm vitest run tests/p1a-bootstrap-gate.test.ts

name: M2 Real PostgreSQL Gate

# Dedicated, isolated real-PostgreSQL proof of M2/B0-17
# (docs/ops/integration/COMMERCIAL_V1_POST_INTEGRATION_MAINTENANCE_AUTHORITY_v1.0.3.json).
#
# This workflow is deliberately separate from p1a-validation.yml. P1A's
# legacy full-stack bootstrap (Supabase CLI + the shared local dev role
# topology) has its own, unrelated bootstrap issues and remains a separate,
# deferred governed node (P1A_FULL_BOOTSTRAP_STATUS=DEFERRED_SEPARATE_GOVERNED_NODE).
# This gate proves M2 specifically, via the governed disposable fixture in
# scripts/m2-disposable-pg-bootstrap.ts, independent of that legacy path.
#
# A green run here with the M2 test skipped or zero-collected is a FAIL —
# scripts/m2-disposable-pg-bootstrap.ts itself asserts exactly 4 tests
# executed and 4 passed as part of its own MAIN phase, so this workflow's
# job simply fails whenever that assertion does.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/commercial-v1
      - main

jobs:
  m2-real-pg-gate:
    name: Isolated M2 disposable PostgreSQL proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The complete governed proof: role identity bootstrap (verbatim,
      # SHA-verified), Option E CREATEROLE narrowing, the three privilege
      # grants (temporary database CREATE, permanent public CREATE, the one
      # supabase_admin USAGE grant), Part A helpers (SHA-verified), the
      # unmodified db:migrate:local entrypoint, ownership/privilege
      # postconditions, the real M2 integration test, and eight negative
      # controls — each phase its own disposable container, torn down
      # unconditionally. See scripts/m2-disposable-pg-bootstrap.ts.
      - name: Run M2 disposable PostgreSQL gate
        run: pnpm m2:pg:gate

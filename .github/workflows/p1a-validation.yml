name: P1A Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-p1a:
    name: Validate P1A Architecture and Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Loopback URLs
        run: |
          echo "Validating that the pinned local stack only targets loopback interfaces..."

          # db/safety/local-stack.ts is now the SINGLE source of truth for the
          # local connection target. drizzle.local.config.ts, scripts/seed-local.ts
          # and scripts/db-audit-readonly.ts all derive their URL from it, so the
          # per-file greps this step used to run were replaced by one check here
          # plus the executable assertions in tests/database-target-safety.test.ts
          # (which also cross-check these constants against supabase/config.toml).
          if ! grep -Ei "^[[:space:]]*export const LOCAL_DATABASE_URL = .*@(127\.0\.0\.1|localhost|\[::1\])" db/safety/local-stack.ts; then
            echo "🚨 Error: db/safety/local-stack.ts contains a non-loopback database URL!"
            exit 1
          fi

          if ! grep -Ei "^[[:space:]]*export const LOCAL_SUPABASE_API_URL = .*https?://(127\.0\.0\.1|localhost|\[::1\])" db/safety/local-stack.ts; then
            echo "🚨 Error: db/safety/local-stack.ts contains a non-loopback Supabase API URL!"
            exit 1
          fi

          # No entry point may resolve its target from DATABASE_URL any more.
          if grep -REn "process\.env\.DATABASE_URL" scripts/ drizzle.config.ts drizzle.local.config.ts; then
            echo "🚨 Error: a script or drizzle config still reads DATABASE_URL directly!"
            exit 1
          fi

          # Check config.toml ports/urls
          if ! grep -Ei "^[[:space:]]*api_url = ['\"]https?://(127\.0\.0\.1|localhost|\[::1\])" supabase/config.toml; then
            echo "🚨 Error: supabase/config.toml api_url is not loopback!"
            exit 1
          fi

          echo "✅ Loopback check passed."

      - name: Database target safety suite
        run: pnpm vitest run tests/database-target-safety.test.ts tests/database-entrypoint-safety.test.ts

      - name: Start Supabase Local
        run: pnpm supabase start

      - name: Export Supabase Local Env Vars
        run: |
          trap 'rm -f .env.supabase' EXIT
          pnpm supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL,auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY,auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY,db.url=DATABASE_URL > .env.supabase
          
          # Validate loopback without printing values
          SB_URL=$(grep NEXT_PUBLIC_SUPABASE_URL .env.supabase | cut -d '=' -f2 | tr -d '\"')
          DB_URL=$(grep DATABASE_URL .env.supabase | cut -d '=' -f2 | tr -d '\"')
          
          # Validate the targets with the repository OWN classifier, never by
          # substring matching. The previous check was
          #   grep -qvE "127.0.0.1|localhost|::1"
          # which is exactly the bug class db/safety/ exists to remove:
          # https://localhost.attacker.example/ contains "localhost", and the
          # unescaped dots also matched 127x0x0x1. Values go through env and
          # are never printed; the classifier reports a redacted host.
          SB_URL="$SB_URL" DB_URL="$DB_URL" node --import tsx scripts/ci-assert-local-targets.ts

          # Export only the four variables used by tests. Supabase CLI wraps
          # values in quotes; GitHub otherwise preserves those quotes and the
          # Postgres client receives an invalid URL.
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            raw_value=$(grep -m1 "^${key}=" .env.supabase | cut -d '=' -f2-)
            value="${raw_value%\"}"
            value="${value#\"}"
            echo "::add-mask::${value}"
            printf '%s=%s\n' "${key}" "${value}" >> "$GITHUB_ENV"
          done

      - name: Run Drizzle Local Migrations
        run: pnpm db:migrate:local

      - name: Run Drizzle Local Seed
        run: pnpm db:seed:local

      - name: Run Integration Tests
        run: pnpm test:integration

      - name: Run RLS Tests
        run: pnpm test:rls

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Build Project
        run: pnpm build

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup

name: Local bootstrap and integration

# F0-04 / F2-02 / F0-07 — Verifica contra un stack Supabase EFÍMERO que:
#   1. El bootstrap funciona desde una base limpia.
#   2. Aplicarlo dos veces seguidas deja el sistema funcional (idempotencia).
#   3. Reaplicar 0033_public_api_grants.sql —el escenario de una restauración de
#      backup— no deja rota la evidencia, porque el bootstrap se autorrepara.
#   4. Las 39 pruebas de integración/RLS pasan después de todo lo anterior.
#
# Todo ocurre contra loopback. La guarda de host (db/guard.ts) aborta el
# proceso si alguna variable apuntara fuera de 127.0.0.1/localhost/::1, así que
# este workflow no puede alcanzar una base remota ni por error de configuración.

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Se conserva el id `validate-p1a` a propósito: es el nombre con el que este
  # check aparece en la protección de rama. Renombrarlo dejaría la regla
  # apuntando a un check inexistente y los PR se quedarían esperando.
  validate-p1a:
    name: Double bootstrap + integration/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Defensa estática, previa a levantar nada: ningún fichero de
      # configuración local debe apuntar fuera de loopback.
      - name: Validate loopback configuration
        run: |
          if ! grep -Ei "^[[:space:]]*const LOCAL_DB_URL = .*@(127\.0\.0\.1|localhost|\[::1\])" drizzle.local.config.ts; then
            echo "::error::drizzle.local.config.ts no apunta a loopback"
            exit 1
          fi
          if ! grep -Ei "^[[:space:]]*api_url = ['\"]https?://(127\.0\.0\.1|localhost|\[::1\])" supabase/config.toml; then
            echo "::error::supabase/config.toml api_url no apunta a loopback"
            exit 1
          fi
          echo "Configuración local verificada: sólo loopback."

      # Demuestra que la guarda rechaza destinos remotos antes de tocar la base.
      - name: Host guard tests
        run: pnpm exec vitest run tests/db-guard.test.ts

      # ── Primera aplicación, desde una base completamente limpia ────────────
      # `db:bootstrap:local` levanta Supabase, aplica supabase/migrations y la
      # cadena de Drizzle en el orden correcto, verifica 11 invariantes y
      # escribe .env.test.local, que es lo que consumen las pruebas.
      - name: Bootstrap (1/2) — clean database
        run: pnpm db:bootstrap:local

      # ── Segunda aplicación consecutiva ─────────────────────────────────────
      - name: Bootstrap (2/2) — idempotency
        run: pnpm db:bootstrap:local

      # ── Regresión de SEC-03 ────────────────────────────────────────────────
      # Reaplicar 0033 revoca EXECUTE sobre los helpers de RLS de Storage y deja
      # inutilizada la subida y lectura de evidencia, en silencio. Se reproduce
      # a propósito y se comprueba que el bootstrap lo repara.
      - name: SEC-03 regression — re-apply 0033 and self-heal
        run: |
          DB_URL=$(grep -m1 '^DATABASE_URL=' .env.test.local | cut -d '=' -f2-)
          echo "::add-mask::${DB_URL}"

          psql "${DB_URL}" -q -v ON_ERROR_STOP=1 -f db/migrations/0033_public_api_grants.sql

          BROKEN=$(psql "${DB_URL}" -t -A -c \
            "select has_function_privilege('authenticated','public.can_write_evidence_object(text,uuid)','EXECUTE')")
          if [ "${BROKEN}" != "f" ]; then
            echo "::error::No se pudo reproducir SEC-03; la prueba de regresión ya no es válida"
            exit 1
          fi
          echo "SEC-03 reproducido: permisos de evidencia revocados."

          pnpm db:bootstrap:local

          FIXED=$(psql "${DB_URL}" -t -A -c \
            "select has_function_privilege('authenticated','public.can_write_evidence_object(text,uuid)','EXECUTE')")
          if [ "${FIXED}" != "t" ]; then
            echo "::error::El bootstrap NO reparó los permisos de evidencia"
            exit 1
          fi
          echo "Reparado por el bootstrap."

      # ── Suite completa contra el stack efímero ─────────────────────────────
      # No se exportan variables: vitest.setup.integration.ts lee .env.test.local,
      # que el bootstrap acaba de generar, y valida el host antes de conectar.
      - name: Integration and RLS tests
        run: pnpm test:integration

      - name: Schema drift check
        run: npx drizzle-kit check

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup
